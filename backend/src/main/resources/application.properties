server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/codeflow}
spring.datasource.username=${DATABASE_USERNAME:codeflow}
spring.datasource.password=${DATABASE_PASSWORD:codeflow}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32chars}
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@codeflow.local}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
